world_id: fertilizer-2021
trade: nitrogen
thesis: gas/ammonia constraints
interval_days: 180
max_age_days: 400
predicates:
  NEED:
    intensity_metric: fert_intensity
    relevance_metric: fert_relevant
    min_intensity: 0.5
    circuit:
      op: IF
      args:
      - op: AND
        args:
        - op: GTE
          args:
          - &id001
            metric: fert_intensity
          - param: min_intensity
        - &id002
          metric: fert_relevant
      - const: 'TRUE'
      - op: IF
        args:
        - op: OR
          args:
          - op: LT
            args:
            - *id001
            - param: kill
          - op: NOT
            args:
            - *id002
        - const: 'FALSE'
        - const: UNKNOWN
  GAP:
    demand:
    - fert_demand
    supply:
    - fert_supply
    threshold: 1.0
    min_sources: 1
    circuit:
      op: IF
      args:
      - op: GTE
        args:
        - op: COUNT
          metrics:
          - fert_demand
          - fert_supply
        - param: min_sources
      - op: IF
        args:
        - op: GT
          args:
          - op: LOW
            metric: fert_demand
          - op: MUL
            args:
            - op: HIGH
              metric: fert_supply
            - param: threshold
        - const: 'TRUE'
        - op: IF
          args:
          - op: LTE
            args:
            - op: HIGH
              metric: fert_demand
            - op: LOW
              metric: fert_supply
          - const: 'FALSE'
          - const: UNKNOWN
      - const: UNKNOWN
  LAG:
    close_metric: fert_close
    horizon_metric: fert_horizon
    circuit:
      op: IF
      args:
      - op: GT
        args:
        - &id003
          metric: fert_close
        - &id004
          metric: fert_horizon
      - const: 'TRUE'
      - op: IF
        args:
        - op: LTE
          args:
          - *id003
          - *id004
        - const: 'FALSE'
        - const: UNKNOWN
  WTP:
    price_metric: fert_price
    qty_metric: fert_qty
    x: 15
    y: 10
    circuit:
      op: IF
      args:
      - op: AND
        args:
        - &id005
          op: GTE
          args:
          - metric: fert_price
          - param: x
        - op: GT
          args:
          - &id006
            metric: fert_qty
          - op: SUB
            args:
            - const: 0
            - param: y
      - const: 'TRUE'
      - op: IF
        args:
        - op: AND
          args:
          - *id005
          - op: LTE
            args:
            - *id006
            - op: SUB
              args:
              - const: 0
              - param: y
        - const: 'FALSE'
        - const: UNKNOWN
  NOSUB:
    share_metric: fert_share
    threshold: 0.25
    redesign_metric: fert_redesign
    circuit:
      op: IF
      args:
      - op: OR
        args:
        - op: GTE
          args:
          - &id007
            metric: fert_share
          - param: share_threshold
        - &id008
          metric: fert_redesign
      - const: 'FALSE'
      - op: IF
        args:
        - op: AND
          args:
          - op: LT
            args:
            - *id007
            - param: share_threshold
          - op: NOT
            args:
            - *id008
        - const: 'TRUE'
        - const: UNKNOWN
