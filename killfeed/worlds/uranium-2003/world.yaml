world_id: uranium-2003
trade: uranium
thesis: renaissance expectations + slow mines
interval_days: 365
max_age_days: 600
predicates:
  NEED:
    intensity_metric: ura_intensity
    relevance_metric: ura_relevant
    min_intensity: 0.5
    circuit:
      op: IF
      args:
      - op: AND
        args:
        - op: GTE
          args:
          - &id001
            metric: ura_intensity
          - param: min_intensity
        - &id002
          metric: ura_relevant
      - const: 'TRUE'
      - op: IF
        args:
        - op: OR
          args:
          - op: LT
            args:
            - *id001
            - param: kill
          - op: NOT
            args:
            - *id002
        - const: 'FALSE'
        - const: UNKNOWN
  GAP:
    demand:
    - ura_demand
    supply:
    - ura_supply
    threshold: 1.0
    min_sources: 1
    circuit:
      op: IF
      args:
      - op: GTE
        args:
        - op: COUNT
          metrics:
          - ura_demand
          - ura_supply
        - param: min_sources
      - op: IF
        args:
        - op: GT
          args:
          - op: LOW
            metric: ura_demand
          - op: MUL
            args:
            - op: HIGH
              metric: ura_supply
            - param: threshold
        - const: 'TRUE'
        - op: IF
          args:
          - op: LTE
            args:
            - op: HIGH
              metric: ura_demand
            - op: LOW
              metric: ura_supply
          - const: 'FALSE'
          - const: UNKNOWN
      - const: UNKNOWN
  LAG:
    close_metric: ura_close
    horizon_metric: ura_horizon
    circuit:
      op: IF
      args:
      - op: GT
        args:
        - &id003
          metric: ura_close
        - &id004
          metric: ura_horizon
      - const: 'TRUE'
      - op: IF
        args:
        - op: LTE
          args:
          - *id003
          - *id004
        - const: 'FALSE'
        - const: UNKNOWN
  WTP:
    price_metric: ura_price
    qty_metric: ura_qty
    x: 15
    y: 10
    circuit:
      op: IF
      args:
      - op: AND
        args:
        - &id005
          op: GTE
          args:
          - metric: ura_price
          - param: x
        - op: GT
          args:
          - &id006
            metric: ura_qty
          - op: SUB
            args:
            - const: 0
            - param: y
      - const: 'TRUE'
      - op: IF
        args:
        - op: AND
          args:
          - *id005
          - op: LTE
            args:
            - *id006
            - op: SUB
              args:
              - const: 0
              - param: y
        - const: 'FALSE'
        - const: UNKNOWN
  NOSUB:
    share_metric: ura_share
    threshold: 0.25
    redesign_metric: ura_redesign
    circuit:
      op: IF
      args:
      - op: OR
        args:
        - op: GTE
          args:
          - &id007
            metric: ura_share
          - param: share_threshold
        - &id008
          metric: ura_redesign
      - const: 'FALSE'
      - op: IF
        args:
        - op: AND
          args:
          - op: LT
            args:
            - *id007
            - param: share_threshold
          - op: NOT
            args:
            - *id008
        - const: 'TRUE'
        - const: UNKNOWN
